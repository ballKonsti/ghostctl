[project]
name = "ghostctl"
version = "0.1.0"
description = "Terminal client for Snapchat Web, driven through Playwright"
readme = "README.md"
authors = [
    { name = "ballKonsti", email = "konstantin@greatbigvalue.com" }
]
requires-python = ">=3.12"
dependencies = [
    "emoji>=2.16.0",
    "keyring>=25.7.0",
    "playwright>=1.63.0",
    "textual>=8.2.8",
    "textual-image>=0.14.1",
]

[project.scripts]
ghostctl = "ghostctl.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
